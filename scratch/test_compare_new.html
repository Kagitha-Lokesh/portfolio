
<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f4f2ee;
    margin: 0;
    padding: 40px;
    display: flex;
    gap: 40px;
  }
  .box {
    width: 384px;
    height: 480px;
    position: relative;
    background-color: #f4f2ee;
  }
  .ghost-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    font-weight: 900;
    -webkit-text-stroke: 1.5px rgba(13, 13, 13, 0.2);
    color: transparent;
    pointer-events: none;
    z-index: 1;
  }
  video, canvas {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ghost-text">LOKESH</div>
    <video id="v1" src="file:///D:/Project/TALKING-VIDEO PORTFOLIO/public/hero/hero.mp4" autoplay muted loop playsinline></video>
  </div>
  <div class="box">
    <div class="ghost-text">LOKESH</div>
    <canvas id="cv" width="768" height="960"></canvas>
  </div>
  <script>
    const v1 = document.getElementById('v1');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function draw() {
      if (v1.readyState >= 2) {
        ctx.drawImage(v1, 0, 0, 768, 960);
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
