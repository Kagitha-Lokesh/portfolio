
<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f4f2ee;
    margin: 0;
    padding: 30px;
  }
  .box {
    display: flex;
    gap: 40px;
  }
  .video-wrap {
    width: 300px;
    height: 375px;
    background: transparent;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
  canvas {
    width: 300px;
    height: 375px;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="video-wrap">
      <h3>Video mix-blend-mode</h3>
      <video id="vid" src="file:///D:/Project/TALKING-VIDEO PORTFOLIO/public/hero/hero.mp4" autoplay muted loop playsinline></video>
    </div>
    <div class="video-wrap">
      <h3>Canvas mix-blend-mode</h3>
      <canvas id="cv" width="768" height="960"></canvas>
    </div>
  </div>
  <script>
    const v = document.getElementById('vid');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function render() {
      if (v.readyState >= 2) {
        ctx.drawImage(v, 0, 0, 768, 960);
      }
      requestAnimationFrame(render);
    }
    v.addEventListener('play', () => render());
    render();
  </script>
</body>
</html>
