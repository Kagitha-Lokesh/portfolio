
<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f4f2ee;
    margin: 0;
    padding: 40px;
  }
  .row {
    display: flex;
    gap: 30px;
  }
  .box {
    width: 250px;
    height: 312px;
  }
  video, canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="box">
      <h4>Video Limited (yuv420p)</h4>
      <video id="v1" src="file:///D:/Project/TALKING-VIDEO PORTFOLIO/scratch/test_vid_86.mp4" autoplay muted loop playsinline></video>
    </div>
    <div class="box">
      <h4>Video Full (yuvj420p)</h4>
      <video id="v2" src="file:///D:/Project/TALKING-VIDEO PORTFOLIO/scratch/test_vid_full.mp4" autoplay muted loop playsinline></video>
    </div>
    <div class="box">
      <h4>Canvas Multiply</h4>
      <canvas id="cv" width="768" height="960"></canvas>
    </div>
  </div>
  <script>
    const v = document.getElementById('v1');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function draw() {
      if (v.readyState >= 2) {
        ctx.drawImage(v, 0, 0, 768, 960);
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
