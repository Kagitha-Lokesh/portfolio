
<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f4f2ee;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .wrap {
    width: 384px;
    height: 480px;
    position: relative;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="wrap">
    <video id="v" src="file:///D:/Project/TALKING-VIDEO PORTFOLIO/public/hero/hero.mp4" autoplay muted loop playsinline style="position:absolute; opacity:0; pointer-events:none;"></video>
    <canvas id="c" width="768" height="960"></canvas>
  </div>
  <script>
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    function draw() {
      if (v.readyState >= 2) {
        ctx.drawImage(v, 0, 0, 768, 960);
      }
      requestAnimationFrame(draw);
    }
    v.addEventListener('play', () => draw());
    draw();
  </script>
</body>
</html>
