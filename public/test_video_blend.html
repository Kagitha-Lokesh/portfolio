<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #f4f2ee;
    margin: 0;
    padding: 50px;
  }
  .test-wrap {
    position: relative;
    width: 400px;
    height: 500px;
    background-color: #f4f2ee;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <h1>Test Video Multiply</h1>
  <div class="test-wrap">
    <video autoplay loop muted playsinline src="/hero/hero.mp4"></video>
  </div>
</body>
</html>
